name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.configuration }})
    runs-on: windows-latest

    strategy:
      # 两种配置都要有结论，不要让其中一个失败掩盖另一个
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 刻意不做 NuGet 还原：
      # 本解决方案**零 NuGet 依赖**，只引用 .NET Framework 4.8 框架程序集
      # （见 Ruijie-WPF.vbproj 的 <Reference> 节点，无 PackageReference / packages.config）。
      # 加 `nuget restore` 只会引入一个必然空转、且可能失败的步骤。

      - name: Build
        shell: pwsh
        run: |
          # Debug 与 Release 在 vbproj 里共用 bin\ 输出目录，直接连续构建会互相覆盖。
          # 用 OutDir 把两种配置分到各自子目录，产物可分别归档、也便于各自跑测试。
          msbuild Ruijie-WPF.sln `
            /t:Rebuild `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform="Any CPU" `
            /p:OutDir="bin\${{ matrix.configuration }}\" `
            /v:minimal /nologo

          if ($LASTEXITCODE -ne 0) {
            Write-Error "构建失败：${{ matrix.configuration }}"
            exit 1
          }

      - name: Verify artifact exists
        shell: pwsh
        run: |
          $exe = "Ruijie-WPF\bin\${{ matrix.configuration }}\Ruijie ePorta Tool.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "未找到构建产物：$exe"
            exit 1
          }
          Write-Host "构建产物：$exe"

      # 质量门禁：离线测试套件，不访问网络、不读写用户配置、退出码即结论
      # （0 = 全部通过，1 = 存在失败，见 ModTestSuite / App.xaml.vb 的 --test 分支）。
      #
      # 刻意**不**在 CI 里跑 --diagnose 与 --preflight：
      #   --diagnose 需要能访问校园门户并已保存配置，干净检出下退出码 2（配置未就绪）；
      #   --preflight 要求配置可用且联网，干净检出下退出码 1（Ready = NO）。
      # 两者都依赖用户本机配置与校园网环境，在 CI 中不具备稳定、明确的意义。
      - name: Run offline tests
        shell: pwsh
        run: |
          $exe = "Ruijie-WPF\bin\${{ matrix.configuration }}\Ruijie ePorta Tool.exe"

          # 本程序是 WPF 的 **GUI 子系统**（WinExe）程序，不能用 `& $exe --test` 取退出码：
          # pwsh 对 GUI 子系统程序不会可靠等待、也不会填充 $LASTEXITCODE，于是
          # `$LASTEXITCODE` 为空，判断分支恒真，Job 被自己的 Write-Error 误判为失败
          # （首次真实 CI 运行 run 35414206509 就是这样红的，而测试其实 142/0 全通过）。
          #
          # 因此必须显式等待进程结束并读 Process.ExitCode：
          #   -Wait      —— 等到进程真正退出（GUI 子系统程序不会自动阻塞住 pwsh）；
          #   -PassThru  —— 拿到 Process 对象，其 ExitCode 才是 --test 的真实结论。
          $log = Join-Path $env:RUNNER_TEMP "offline-test-${{ matrix.configuration }}.log"
          if (Test-Path $log) { Remove-Item $log -Force }

          $process = $null
          try {
            $process = Start-Process `
              -FilePath $exe `
              -ArgumentList "--test" `
              -Wait `
              -PassThru `
              -RedirectStandardOutput $log `
              -ErrorAction Stop
          } catch {
            Write-Error "无法启动被测程序（$exe）：$($_.Exception.Message)"
            exit 4
          }

          $code = $process.ExitCode

          # GUI 子系统程序的输出同样不会被 pwsh 捕获，必须回显，否则失败原因不可见
          if (Test-Path $log) { Get-Content $log | Write-Host }

          Write-Host "--- --test 退出码：$code ---"

          # 关键防线：拿不到退出码时**必须与「测试失败」区分开**。
          # $null / "" 参与 -ne 0 比较结果恒为真，若直接落进下面的分支，
          # 就会重复「测试其实全过、却被自己判红」的原故障 —— 正是要修掉的那个。
          if ([string]::IsNullOrEmpty($code)) {
            Write-Error "未能取得 --test 的退出码（进程启动失败或未真正退出），本次结果不可信"
            exit 3
          }

          # 顺带写进 Job Summary，失败时不必翻完整日志
          if ($env:GITHUB_STEP_SUMMARY) {
            @(
              "### 离线测试（${{ matrix.configuration }}）"
              ""
              "``--test`` 退出码：``$code`` （0 = 全部通过）"
              ""
              '```'
              (Get-Content $log -Tail 4 | Out-String).Trim()
              '```'
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          if ($code -ne 0) {
            Write-Error "离线测试失败（${{ matrix.configuration }}，退出码 $code）"
            exit $code
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ruijie-ePorta-Tool-${{ matrix.configuration }}
          path: |
            Ruijie-WPF/bin/${{ matrix.configuration }}/Ruijie ePorta Tool.exe
            Ruijie-WPF/bin/${{ matrix.configuration }}/Ruijie ePorta Tool.pdb
          if-no-files-found: error
